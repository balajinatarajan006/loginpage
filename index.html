<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Management System</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="login-card">

        <h1>Scholarship Management System</h1>
        <p class="subtitle">Student Login Portal</p>

        <input type="email" id="username" placeholder="Email Address">

        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p class="new-user">New User?</p>

        <a href="#" class="register-btn">Register New User</a>

        <p id="message"></p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
