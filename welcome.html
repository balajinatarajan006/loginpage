<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

.welcome-card{

width:500px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(18px);
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.25);
color:white;

}

.welcome-card h1{

margin-bottom:15px;
font-size:32px;

}

.info{

margin:15px 0;
font-size:18px;

}

.logout{

margin-top:25px;
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:white;
color:#4f46e5;
font-size:17px;
font-weight:600;
cursor:pointer;

}

.logout:hover{

background:#ecebff;

}

</style>

</head>

<body>

<div class="welcome-card">

<h1>Scholarship Management System</h1>

<h2>Welcome</h2>

<div class="info">
<b>Name :</b>
<span id="name"></span>
</div>

<div class="info">
<b>Email :</b>
<span id="email"></span>
</div>

<div class="info">
<b>Register Number :</b>
<span id="regno"></span>
</div>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

<script>

let user=JSON.parse(localStorage.getItem("loggedUser"));

if(user==null){

window.location.href="index.html";

}

document.getElementById("name").innerHTML=user.name;
document.getElementById("email").innerHTML=user.email;
document.getElementById("regno").innerHTML=user.regno;

function logout(){

localStorage.removeItem("loggedUser");

window.location.href="index.html";

}

</script>

</body>

</html>
