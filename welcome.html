<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Poppins,sans-serif;

}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#4f46e5,#06b6d4);

}

.card{

background:white;

padding:45px;

border-radius:20px;

text-align:center;

box-shadow:0 10px 30px rgba(0,0,0,.2);

}

h1{

color:#4f46e5;

margin-bottom:15px;

}

p{

margin-bottom:20px;

}

button{

padding:14px 30px;

border:none;

background:#4f46e5;

color:white;

font-size:16px;

border-radius:10px;

cursor:pointer;

}

button:hover{

background:#3b34d1;

}

</style>

</head>

<body>

<div class="card">

<h1>Welcome!</h1>

<p>Login Successful.</p>

<button onclick="window.location.href='index.html'">

Logout

</button>

</div>

</body>

</html>
